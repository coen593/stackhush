name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # These three run on the example config.
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # The shipped wrangler.jsonc and .gitignore are still templates and match the test fixture.
      # Upstream only: a private fork fills them in on purpose.
      - name: Check the shipped templates
        if: github.repository == 'coen593/stackhush'
        run: npm run check-templates

      # Rebuilds with a CI-only config (one uptime URL, https://example.com, no tokens), runs the
      # Worker in workerd, triggers one scheduled run and fails unless the run stored rows and
      # the uptime check got a 200, which proves the Worker can make outgoing requests.
      - name: Smoke test in workerd
        run: .github/ci/smoke.sh
